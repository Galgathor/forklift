# Requires Docker Compose supporting !reset. No source builds in this overlay.
services:
  initialize:
    build: !reset null
    image: ghcr.io/galgathor/forklift-maintenance:${FORKLIFT_IMAGE_TAG:-latest}
  ldap:
    build: !reset null
    image: ghcr.io/galgathor/forklift-ldap:${FORKLIFT_IMAGE_TAG:-latest}
  maintenance:
    build: !reset null
    image: ghcr.io/galgathor/forklift-maintenance:${FORKLIFT_IMAGE_TAG:-latest}
  dns:
    build: !reset null
    image: ghcr.io/galgathor/forklift-dns:${FORKLIFT_IMAGE_TAG:-latest}
  discovery:
    build: !reset null
    image: ghcr.io/galgathor/forklift-manager:${FORKLIFT_IMAGE_TAG:-latest}
  manager:
    build: !reset null
    image: ghcr.io/galgathor/forklift-manager:${FORKLIFT_IMAGE_TAG:-latest}
