services:
  replica:
    build:
      context: ../..
      dockerfile: docker/replica/Dockerfile
    restart: unless-stopped
    network_mode: host
    user: "10001:10001"
    environment:
      FORKLIFT_REPLICA_JOIN: ${FORKLIFT_REPLICA_JOIN:-}
    volumes:
      - replica_data:/directory
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: [CMD, python3, /replica.py, health]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  replica_data:
