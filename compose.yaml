services:
  initialize:
    image: ${FORKLIFT_IMAGE_PREFIX:?Set FORKLIFT_IMAGE_PREFIX in .env}/forklift-maintenance:${FORKLIFT_IMAGE_TAG:?Set FORKLIFT_IMAGE_TAG in .env}
    command: [init]
    user: "10001:10001"
    network_mode: none
    environment:
      FORKLIFT_BOOTSTRAP_TOKEN: ${FORKLIFT_BOOTSTRAP_TOKEN:-}
    volumes:
      - dns_data:/dns
      - dns_secrets:/dns-secrets
      - dns_control:/run/dns-control
      - directory:/directory
      - metadata:/metadata
      - manager_secrets:/secrets
      - directory_secrets:/directory-secrets
      - authority:/authority
      - backups:/backups
      - transfers:/transfers
      - maintenance_work:/work
      - ldap_control:/run/ldap-control
      - maintenance_control:/run/maintenance-control
      - ldap_socket:/run/ldap-socket
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  ldap:
    image: ${FORKLIFT_IMAGE_PREFIX:?Set FORKLIFT_IMAGE_PREFIX in .env}/forklift-ldap:${FORKLIFT_IMAGE_TAG:?Set FORKLIFT_IMAGE_TAG in .env}
    restart: unless-stopped
    network_mode: host
    depends_on:
      initialize: {condition: service_completed_successfully}
    volumes:
      - directory:/directory
      - directory_secrets:/run/secrets:ro
      - ldap_control:/run/ldap-control
      - ldap_socket:/run/ldap-socket
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, python3, -c, "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/ldap-control/primary.sock'); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 10
  maintenance:
    image: ${FORKLIFT_IMAGE_PREFIX:?Set FORKLIFT_IMAGE_PREFIX in .env}/forklift-maintenance:${FORKLIFT_IMAGE_TAG:?Set FORKLIFT_IMAGE_TAG in .env}
    restart: unless-stopped
    user: "10001:10001"
    network_mode: none
    depends_on:
      initialize: {condition: service_completed_successfully}
      ldap: {condition: service_healthy}
    volumes:
      - dns_data:/dns
      - dns_secrets:/dns-secrets
      - dns_control:/run/dns-control
      - directory:/directory
      - metadata:/metadata
      - manager_secrets:/secrets
      - directory_secrets:/directory-secrets
      - directory_secrets:/run/secrets:ro
      - authority:/authority
      - backups:/backups
      - transfers:/transfers
      - maintenance_work:/work
      - ldap_control:/run/ldap-control
      - maintenance_control:/run/maintenance-control
      - ldap_socket:/run/ldap-socket
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, python3, -c, "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/maintenance-control/maintenance.sock'); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 10
  dns:
    image: ${FORKLIFT_IMAGE_PREFIX:?Set FORKLIFT_IMAGE_PREFIX in .env}/forklift-dns:${FORKLIFT_IMAGE_TAG:?Set FORKLIFT_IMAGE_TAG in .env}
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - '${FORKLIFT_DNS_BIND:-0.0.0.0}:${FORKLIFT_DNS_PORT:-53}:5353/udp'
      - '${FORKLIFT_DNS_BIND:-0.0.0.0}:${FORKLIFT_DNS_PORT:-53}:5353/tcp'
    volumes:
      - dns_data:/dns
      - dns_secrets:/run/dns-secrets
      - dns_control:/run/dns-control
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, python3, /supervisor.py, health]
      interval: 10s
      timeout: 5s
      retries: 5
  discovery:
    profiles: [discovery]
    image: ${FORKLIFT_IMAGE_PREFIX:?Set FORKLIFT_IMAGE_PREFIX in .env}/forklift-manager:${FORKLIFT_IMAGE_TAG:?Set FORKLIFT_IMAGE_TAG in .env}
    entrypoint: [/app/forklift, publish-discovery]
    restart: unless-stopped
    user: "10001:10001"
    network_mode: host
    environment:
      FORKLIFT_PUBLIC_URL: ${FORKLIFT_PUBLIC_URL:-http://localhost:8080}
      FORKLIFT_DISCOVERY_CA_FILE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - type: bind
        source: ${FORKLIFT_DISCOVERY_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
        target: /etc/ssl/certs/ca-certificates.crt
        read_only: true
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  manager:
    image: ${FORKLIFT_IMAGE_PREFIX:?Set FORKLIFT_IMAGE_PREFIX in .env}/forklift-manager:${FORKLIFT_IMAGE_TAG:?Set FORKLIFT_IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      FORKLIFT_PUBLIC_URL: ${FORKLIFT_PUBLIC_URL:-http://localhost:8080}
      FORKLIFT_DNS_BIND: ${FORKLIFT_DNS_BIND:-0.0.0.0}
      FORKLIFT_DNS_PORT: ${FORKLIFT_DNS_PORT:-53}
    ports:
      - '${FORKLIFT_BIND:-127.0.0.1}:${FORKLIFT_PORT:-8080}:8080'
    volumes:
      - metadata:/data
      - manager_secrets:/run/secrets:ro
      - ldap_socket:/run/ldap-socket
      - ldap_control:/run/ldap-control
      - maintenance_control:/run/maintenance-control
      - transfers:/transfers
      - backups:/backups:ro
      - dns_secrets:/run/dns-secrets:ro
      - dns_control:/run/dns-control
    depends_on:
      maintenance: {condition: service_healthy}
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, /usr/bin/curl, -fsS, 'http://localhost:8080/health']
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  directory:
  metadata:
  manager_secrets:
  directory_secrets:
  authority:
  backups:
  transfers:
  maintenance_work:
  ldap_control:
  maintenance_control:
  ldap_socket:
  dns_data:
  dns_secrets:
  dns_control:
