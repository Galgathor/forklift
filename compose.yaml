services:
  ldap:
    build:
      context: .
      dockerfile: docker/openldap/Dockerfile
    restart: unless-stopped
    volumes:
      - directory:/directory
      - ./.secrets/ca.crt:/run/secrets/ca.crt:ro
      - ./.secrets/ldap.crt:/run/secrets/ldap.crt:ro
      - ./.secrets/ldap.key:/run/secrets/ldap.key:ro
      - ./.secrets/provision:/run/secrets/provision:ro
      - ./.secrets/service:/run/secrets/service:ro
    networks: [directory]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request, ssl; urllib.request.urlopen('https://ldap:8090/health', context=ssl.create_default_context(cafile='/run/secrets/ca.crt'))"]
      interval: 10s
      timeout: 3s
      retries: 5
  manager:
    build:
      context: .
      dockerfile: docker/manager/Dockerfile
    restart: unless-stopped
    environment:
      FORKLIFT_PUBLIC_URL: ${FORKLIFT_PUBLIC_URL:-http://localhost:8080}
      LDAPTLS_CACERT: /run/secrets/ca.crt
      SSL_CERT_FILE: /run/secrets/ca.crt
    ports:
      - '${FORKLIFT_BIND:-127.0.0.1}:${FORKLIFT_PORT:-8080}:8080'
    volumes:
      - metadata:/data
      - ./.secrets/bootstrap:/run/secrets/bootstrap:ro
      - ./.secrets/provision:/run/secrets/provision:ro
      - ./.secrets/service:/run/secrets/service:ro
      - ./.secrets/ca.crt:/run/secrets/ca.crt:ro
    networks: [directory, web]
    depends_on:
      ldap: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /usr/bin/curl, -fsS, 'http://localhost:8080/health']
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  directory:
  metadata:
networks:
  directory:
    internal: true
  web:
