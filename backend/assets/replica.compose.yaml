services:
  prepare:
    image: alpine:3.22.2
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./enrollment:/source:ro
      - replica_enrollment:/target
    entrypoint:
      - sh
      - -ec
      - |
        umask 077
        cp /source/enrollment.json /target/enrollment.json
        cp /source/provider-ca.crt /target/provider-ca.crt
        if [ -f /source/manager-ca.crt ]; then cp /source/manager-ca.crt /target/manager-ca.crt; else rm -f /target/manager-ca.crt; fi
        chown -R 10001:10001 /target
        chmod 700 /target
        chmod 600 /target/*
  replica:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      prepare: {condition: service_completed_successfully}
    network_mode: host
    user: "10001:10001"
    volumes:
      - replica_data:/directory
      - replica_enrollment:/enrollment:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, python3, /replica.py, health]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  replica_data:
  replica_enrollment:
